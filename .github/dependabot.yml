# Dependabot: keeps GitHub Actions up to date.
version: 2
updates:
  # Updates the pinned commit SHAs of the actions used in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days after a release before proposing it.
    cooldown:
      default-days: 3 # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
    # One pull request for all action updates.
    groups:
      actions:
        patterns: ["*"]
