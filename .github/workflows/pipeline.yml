name: Pipeline

# Each job runs a script in .github/workflows/scripts, to keep logic out of
# the YAML. Ported from the single-repo pipeline (Guilherme Wind).
#
# Stages:
#   1. Quality: secrets
#   2. Build: install, lint, typecheck, build, audit
#   3. Gate: unified status

on:
  push:
    branches: [main, development, "ft/**"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- STAGE 1: QUALITY ---
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/workflows/scripts/secrets.sh scan

  # --- STAGE 2: BUILD ---
  website-test:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: .github/workflows/scripts/website.sh install
      - run: .github/workflows/scripts/website.sh lint
      - run: .github/workflows/scripts/website.sh typecheck
      - run: .github/workflows/scripts/website.sh build
      - run: .github/workflows/scripts/website.sh audit

  # --- GATE: unified status ---
  gate:
    name: Pipeline Status
    if: always()
    needs: [secrets, website-test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Pipeline failed"
            exit 1
          fi
          echo "Pipeline passed"
